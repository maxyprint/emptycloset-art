  <style>
:root {
  --bg: #0c0c0c; --fg: #f0f0f0; --dim: rgba(240,240,240,0.38); --line: rgba(240,240,240,0.1);
  --dur-sm: 250ms; --dur-md: 400ms; --dur-lg: 600ms;
  --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'Barlow Condensed', sans-serif; background: var(--bg); color: var(--fg); -webkit-font-smoothing: antialiased; min-height: 100vh; }
input, button, textarea { font-family: inherit; color: inherit; background: none; border: none; outline: none; resize: none; }
button { cursor: pointer; font-weight: 700; }
a { color: inherit; text-decoration: none; }

/* ── Admin bar ───────────────────────────────────────────── */
#admin-bar {
  display: none; position: fixed; top: 0; left: 0; right: 0; z-index: 200;
  height: 36px; align-items: center; justify-content: space-between;
  padding: 0 2.5rem;
  background: rgba(255,255,255,0.04); border-bottom: 1px solid var(--line);
  font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim);
  overflow: hidden; transition: height 0.2s ease, opacity 0.2s ease, border-color 0.2s ease;
}
#admin-bar.collapsed { height: 0; opacity: 0; border-bottom-color: transparent; }
#admin-bar a { color: var(--fg); text-decoration: none; letter-spacing: 0.1em; font-size: 9px; }
#admin-bar a:hover { opacity: 0.7; }
#admin-bar-btn { font-size: 8px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--dim); cursor: pointer; padding: 3px 8px; border: 1px solid var(--line); border-radius: 10px; background: none; font-family: inherit; transition: color 0.15s, border-color 0.15s; }
#admin-bar-btn:hover { color: var(--fg); border-color: var(--fg); }
#admin-tab {
  display: none; position: fixed; top: 10px; right: 2.5rem; z-index: 300;
  align-items: center; gap: 5px;
  background: rgba(255,255,255,0.06); border: 1px solid var(--line); border-radius: 20px;
  padding: 4px 10px; font-size: 8px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim);
  cursor: pointer; font-family: inherit; transition: color 0.15s, border-color 0.15s;
}
#admin-tab:hover { color: var(--fg); border-color: rgba(255,255,255,0.2); }
body.admin-visible .nav { top: 36px; }
body.admin-visible .page { padding-top: calc(var(--nav-h, 72px) + 36px); }
body.admin-collapsed .nav { top: 0; }
body.admin-collapsed #admin-tab { display: flex; }

/* ── Nav ─────────────────────────────────────────────────── */
.nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  display: flex; align-items: center; justify-content: space-between;
  padding: 1.2rem 2.5rem;
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--line);
}
.n-mark { display: flex; align-items: center; gap: 1rem; }
.ec-logo { height: 16px; width: auto; }
.n-label { font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--dim); padding-left: 1rem; border-left: 1px solid var(--line); }
.n-right { display: flex; align-items: center; gap: 1.5rem; }
.n-link { font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); transition: color var(--dur-sm); }
.n-link:hover, .n-link.active { color: var(--fg); }
.n-logout { font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); padding: 0.5rem 1rem; border: 1px solid var(--line); border-radius: 20px; transition: border-color var(--dur-sm), color var(--dur-sm); }
.n-logout:hover { border-color: var(--fg); color: var(--fg); }

/* ── Page ─────────────────────────────────────────────────── */
.page { padding: 6rem 2.5rem 5rem; max-width: 1100px; margin: 0 auto; }
.section-header { margin-bottom: 2.5rem; padding-bottom: 1.25rem; border-bottom: 1px solid var(--line); }
.section-label { font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--dim); font-weight: 400; }
.section-title { font-size: clamp(1.75rem, 3vw, 2.5rem); text-transform: uppercase; letter-spacing: -0.01em; margin-top: 0.4rem; }
.section-block { margin-bottom: 5rem; }

/* ── Vote cards ──────────────────────────────────────────── */
.votes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1px; border: 1px solid var(--line); }
.vote-card {
  padding: 2rem; border-right: 1px solid var(--line);
  display: flex; flex-direction: column; gap: 1.25rem;
}
.vote-card:last-child { border-right: none; }
.vote-img { width: 100%; aspect-ratio: 4/3; object-fit: cover; border-radius: 4px; background: rgba(240,240,240,0.04); }
.vote-title { font-size: 1.25rem; text-transform: uppercase; letter-spacing: -0.01em; }
.vote-desc { font-family: 'DM Sans', sans-serif; font-weight: 300; font-size: 12px; line-height: 1.65; color: var(--dim); }
.vote-closes { font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--dim); font-weight: 400; }
.vote-bar-wrap { }
.vote-bar-track { height: 2px; background: var(--line); border-radius: 100px; overflow: hidden; margin-bottom: 0.5rem; }
.vote-bar-fill { height: 100%; background: var(--fg); border-radius: 100px; transition: width 0.6s cubic-bezier(0.16,1,0.3,1); }
.vote-counts { display: flex; justify-content: space-between; font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--dim); font-weight: 400; }
.vote-btns { display: flex; gap: 0.5rem; margin-top: 0.25rem; }
.vote-btn {
  flex: 1; padding: 0.6rem 0;
  font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
  border: 1px solid var(--line); border-radius: 8px;
  transition: background var(--dur-sm), border-color var(--dur-sm), color var(--dur-sm);
}
.vote-btn:hover { border-color: rgba(240,240,240,0.3); }
.vote-btn.selected-yes { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.vote-btn.selected-no  { background: rgba(255,80,80,0.15); border-color: rgba(255,80,80,0.5); color: rgba(255,80,80,0.9); }
.vote-btn:disabled { opacity: 0.35; cursor: default; }
.votes-empty { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); font-weight: 400; padding: 2rem 0; }

/* ── Designer application card ───────────────────────────── */
.apply-card {
  border: 1px solid var(--line); padding: 2.5rem 2rem;
  display: flex; flex-direction: column; gap: 1.25rem; max-width: 500px;
}
.apply-label { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim); font-weight: 400; }
.apply-title { font-size: clamp(1.5rem, 3vw, 2.25rem); text-transform: uppercase; letter-spacing: -0.01em; line-height: 1; }
.apply-desc { font-family: 'DM Sans', sans-serif; font-weight: 300; font-size: 13px; line-height: 1.7; color: var(--dim); }
.apply-status {
  font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
  padding: 0.5rem 1rem; border-radius: 100px; width: fit-content;
  font-weight: 400;
}
.apply-status.pending  { border: 1px solid rgba(240,200,80,0.3); color: rgba(240,200,80,0.8); }
.apply-status.accepted { border: 1px solid rgba(80,200,80,0.3); color: rgba(80,200,80,0.8); }
.apply-status.rejected { border: 1px solid var(--line); color: var(--dim); }
.apply-btn {
  font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
  border: 1px solid var(--fg); border-radius: 10px; padding: 0.75rem 1.5rem;
  width: fit-content; transition: background var(--dur-sm), color var(--dur-sm);
}
.apply-btn:hover { background: var(--fg); color: var(--bg); }

/* ── Apply modal ─────────────────────────────────────────── */
#apply-gate {
  position: fixed; inset: 0; z-index: 500; background: rgba(12,12,12,0.96);
  opacity: 0; pointer-events: none;
  transition: opacity var(--dur-md) var(--ease-out-expo);
  display: flex; align-items: center; justify-content: center; padding: 2rem;
  overflow-y: auto;
}
#apply-gate.on { opacity: 1; pointer-events: all; }
.apply-modal { width: 100%; max-width: 440px; }
.apply-modal-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 2rem; }
.apply-modal-title { font-size: clamp(2rem, 5vw, 3rem); text-transform: uppercase; letter-spacing: -0.02em; line-height: 0.92; }
.modal-close { position: relative; width: 14px; height: 14px; cursor: pointer; flex-shrink: 0; margin-top: 6px; transition: opacity var(--dur-sm); }
.modal-close:hover { opacity: 0.4; }
.modal-close::before, .modal-close::after { content: ''; position: absolute; left: 0; top: 50%; width: 100%; height: 1px; background: var(--fg); }
.modal-close::before { transform: rotate(45deg); }
.modal-close::after  { transform: rotate(-45deg); }
.a-field { border-bottom: 1px solid var(--line); margin-bottom: 1.25rem; position: relative; }
.a-field input, .a-field textarea {
  padding: 0.9rem 0; font-size: 12px; letter-spacing: 0.06em; font-weight: 400; width: 100%;
}
.a-field textarea { min-height: 80px; }
.a-field input::placeholder, .a-field textarea::placeholder { font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); }
.a-underline { position: absolute; bottom: -1px; left: 0; width: 100%; height: 1px; background: var(--fg); transform: scaleX(0); transform-origin: left; transition: transform var(--dur-md) var(--ease-out-expo); }
.a-field input:focus + .a-underline, .a-field textarea:focus + .a-underline { transform: scaleX(1); }
.a-error { font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(255,80,80,0.9); margin-bottom: 0.75rem; display: none; }
.a-error.on { display: block; }
.a-submit { width: 100%; padding: 1rem 0; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; border: 1px solid var(--fg); border-radius: 10px; transition: background var(--dur-sm), color var(--dur-sm); margin-top: 0.5rem; }
.a-submit:hover:not(:disabled) { background: var(--fg); color: var(--bg); }
.a-submit:disabled { opacity: 0.4; cursor: default; }

/* ── Auth guard ──────────────────────────────────────────── */
#auth-guard { position: fixed; inset: 0; background: var(--bg); z-index: 900; display: flex; align-items: center; justify-content: center; }
#auth-guard.off { display: none; }
  </style>
</head>
<body>

<!-- Admin bar -->
<div id="admin-bar">
  <span>Admin Mode</span>
  <div style="display:flex;align-items:center;gap:1.5rem">
    <a href="https://app.yprint.de/admin/ec">EC Admin →</a>
    <button id="admin-bar-btn" onclick="toggleAdminBar()">▲ hide</button>
  </div>
</div>
<button id="admin-tab" onclick="toggleAdminBar()">◈ admin</button>

<div id="auth-guard"></div>

<header class="nav">
  <div class="n-mark">
    <svg class="ec-logo" fill="currentColor" role="img" aria-label="Empty Closet"><use href="#ec-logo"/></svg>
    <span class="n-label">Community</span>
  </div>
  <div class="n-right">
    <a class="n-link" href="/archive">Archive</a>
    <a class="n-link active" href="/community">Community</a>
    <a class="n-link" href="/settings">Settings</a>
    <button class="n-logout" onclick="logout()">Logout</button>
  </div>
</header>

<main class="page" id="main-page" style="display:none">

  <!-- Design Authority -->
  <div class="section-block" id="design-votes-section" style="display:none">
    <div class="section-header">
      <div class="section-label">Design Authority</div>
      <div class="section-title">Open Ballot &nbsp;·&nbsp; S/S 26</div>
    </div>
    <div id="design-votes-grid" class="votes-grid"></div>
  </div>

  <!-- Collective Direction -->
  <div class="section-block" id="decision-votes-section" style="display:none">
    <div class="section-header">
      <div class="section-label">Collective Direction</div>
      <div class="section-title">Platform Decisions</div>
    </div>
    <div id="decision-votes-grid" class="votes-grid"></div>
  </div>

  <!-- Designer Program -->
  <div class="section-block" id="designer-section">
    <div class="section-header">
      <div class="section-label">Design Program</div>
      <div class="section-title">Become a Designer</div>
    </div>
    <div class="apply-card" id="apply-card"></div>
  </div>

</main>

<!-- Apply Modal -->
<div id="apply-gate">
  <div class="apply-modal">
    <div class="apply-modal-header">
      <h2 class="apply-modal-title">Apply as<br>Designer.</h2>
      <button class="modal-close" onclick="closeApply()" aria-label="Close"></button>
    </div>
    <div class="a-field">
      <input type="url" id="a-portfolio" placeholder="Portfolio URL (optional)">
      <div class="a-underline"></div>
    </div>
    <div class="a-field">
      <textarea id="a-msg" rows="4" placeholder="Tell us about your work and why you want in."></textarea>
      <div class="a-underline"></div>
    </div>
    <div class="a-error" id="a-error"></div>
    <button class="a-submit" id="a-submit" onclick="submitApplication()">Submit Application</button>
  </div>
</div>

<script>
const EC_API = 'https://app.yprint.de';
let token = null;
let applicationStatus = null;

/* ── Auth ──────────────────────────────────────────────────── */
async function init() {
  token = localStorage.getItem('ec_token');
  if (!token) { location.href = '/'; return; }

  let meData;
  try {
    const res = await fetch(EC_API + '/api/ec/me', { headers: { Authorization: 'Bearer ' + token } });
    if (!res.ok) { location.href = '/'; return; }
    meData = await res.json();
  } catch { location.href = '/'; return; }

  document.getElementById('auth-guard').classList.add('off');
  document.getElementById('main-page').style.display = '';

  if (meData?.is_admin) showAdminBar();

  await Promise.all([loadVotes(), loadDesignerStatus()]);
}

function showAdminBar() {
  const bar = document.getElementById('admin-bar');
  bar.style.display = 'flex';
  const collapsed = sessionStorage.getItem('adminBarCollapsed') === '1';
  if (collapsed) {
    bar.classList.add('collapsed');
    document.body.classList.add('admin-collapsed');
  } else {
    document.body.classList.add('admin-visible');
  }
}

function toggleAdminBar() {
  const bar = document.getElementById('admin-bar');
  const isCollapsed = bar.classList.toggle('collapsed');
  document.body.classList.toggle('admin-visible', !isCollapsed);
  document.body.classList.toggle('admin-collapsed', isCollapsed);
  sessionStorage.setItem('adminBarCollapsed', isCollapsed ? '1' : '0');
}

function logout() {
  localStorage.removeItem('ec_token');
  location.href = '/';
}

/* ── Votes ─────────────────────────────────────────────────── */
async function loadVotes() {
  try {
    const res = await fetch(EC_API + '/api/ec/votes', { headers: { Authorization: 'Bearer ' + token } });
    if (!res.ok) return;
    const { data } = await res.json();

    const design   = (data || []).filter(v => v.type === 'design');
    const decision = (data || []).filter(v => v.type === 'decision');

    renderVotes(design,   'design-votes-grid',   'design-votes-section');
    renderVotes(decision, 'decision-votes-grid', 'decision-votes-section');
  } catch {}
}

function renderVotes(items, gridId, sectionId) {
  const grid    = document.getElementById(gridId);
  const section = document.getElementById(sectionId);
  if (!items.length) { section.style.display = 'none'; return; }
  section.style.display = '';

  grid.innerHTML = items.map(v => {
    const pct = v.total_count > 0 ? Math.round((v.yes_count / v.total_count) * 100) : 50;
    const closesStr = v.closes_at ? 'Closes ' + new Date(v.closes_at).toLocaleDateString('en-GB', { day:'numeric', month:'short' }) : 'Open';
    const imgHtml = v.images?.[0]?.url
      ? `<img class="vote-img" src="${v.images[0].url}" alt="${v.title}" loading="lazy">`
      : '';
    return `
      <div class="vote-card" id="vote-${v.id}">
        ${imgHtml}
        <div class="vote-title">${v.title}</div>
        ${v.description ? `<div class="vote-desc">${v.description}</div>` : ''}
        <div class="vote-closes">${closesStr}</div>
        <div class="vote-bar-wrap">
          <div class="vote-bar-track"><div class="vote-bar-fill" id="bar-${v.id}" style="width:${pct}%"></div></div>
          <div class="vote-counts">
            <span id="yes-count-${v.id}">${v.yes_count} yes</span>
            <span id="no-count-${v.id}">${v.no_count} no</span>
          </div>
        </div>
        <div class="vote-btns">
          <button class="vote-btn ${v.user_vote === true ? 'selected-yes' : ''}" id="btn-yes-${v.id}" onclick="castVote('${v.id}', true)">Yes</button>
          <button class="vote-btn ${v.user_vote === false ? 'selected-no' : ''}" id="btn-no-${v.id}" onclick="castVote('${v.id}', false)">No</button>
        </div>
      </div>`;
  }).join('');
}

async function castVote(itemId, vote) {
  const btnYes = document.getElementById('btn-yes-' + itemId);
  const btnNo  = document.getElementById('btn-no-'  + itemId);
  btnYes.disabled = true; btnNo.disabled = true;

  try {
    const res = await fetch(EC_API + '/api/ec/votes/' + itemId, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
      body: JSON.stringify({ vote }),
    });
    if (!res.ok) { btnYes.disabled = false; btnNo.disabled = false; return; }
    const data = await res.json();

    const pct = data.total_count > 0 ? Math.round((data.yes_count / data.total_count) * 100) : 50;
    document.getElementById('bar-' + itemId).style.width = pct + '%';
    document.getElementById('yes-count-' + itemId).textContent = data.yes_count + ' yes';
    document.getElementById('no-count-'  + itemId).textContent = data.no_count  + ' no';

    btnYes.classList.toggle('selected-yes', vote === true);
    btnYes.classList.toggle('selected-no',  false);
    btnNo.classList.toggle('selected-no',   vote === false);
    btnNo.classList.toggle('selected-yes',  false);
  } catch {}

  btnYes.disabled = false; btnNo.disabled = false;
}

/* ── Designer status ──────────────────────────────────────── */
async function loadDesignerStatus() {
  try {
    const res = await fetch(EC_API + '/api/ec/apply-designer', { headers: { Authorization: 'Bearer ' + token } });
    if (!res.ok) return;
    const data = await res.json();
    applicationStatus = data.application?.status ?? null;
    renderDesignerCard(data.role, data.application);
  } catch {}
}

function renderDesignerCard(role, application) {
  const card = document.getElementById('apply-card');

  if (role === 'designer') {
    card.innerHTML = `
      <div class="apply-label">Design Program</div>
      <div class="apply-title">Active<br>Designer.</div>
      <div class="apply-desc">Your role is confirmed. Submit designs through the yprint platform and they may enter the Empty Closet collection.</div>
      <span class="apply-status accepted">Designer — Active</span>`;
    return;
  }

  if (!application) {
    card.innerHTML = `
      <div class="apply-label">Design Program</div>
      <div class="apply-title">Become a<br>Designer.</div>
      <div class="apply-desc">Have a vision for what Empty Closet should be? Submit an application. We review every entry.</div>
      <button class="apply-btn" onclick="openApply()">Apply Now →</button>`;
    return;
  }

  const statusMap = {
    pending:  { label: 'Application Under Review', cls: 'pending' },
    accepted: { label: 'Application Accepted', cls: 'accepted' },
    rejected: { label: 'Application Declined', cls: 'rejected' },
  };
  const s = statusMap[application.status] || statusMap.pending;
  card.innerHTML = `
    <div class="apply-label">Design Program</div>
    <div class="apply-title">Your<br>Application.</div>
    <div class="apply-desc">${application.message}</div>
    <span class="apply-status ${s.cls}">${s.label}</span>`;
}

/* ── Apply modal ──────────────────────────────────────────── */
function openApply() {
  document.getElementById('apply-gate').classList.add('on');
  setTimeout(() => document.getElementById('a-portfolio').focus(), 80);
}
function closeApply() { document.getElementById('apply-gate').classList.remove('on'); }
document.getElementById('apply-gate').addEventListener('click', function(e) { if (e.target === this) closeApply(); });
document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeApply(); });

async function submitApplication() {
  const portfolio = document.getElementById('a-portfolio').value.trim();
  const msg       = document.getElementById('a-msg').value.trim();
  const btn       = document.getElementById('a-submit');
  const errEl     = document.getElementById('a-error');

  errEl.classList.remove('on');
  if (!msg) { errEl.textContent = 'Please tell us about your work'; errEl.classList.add('on'); return; }

  btn.disabled = true; btn.textContent = 'Submitting…';

  try {
    const res = await fetch(EC_API + '/api/ec/apply-designer', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
      body: JSON.stringify({ portfolio_url: portfolio || undefined, message: msg }),
    });
    const data = await res.json();
    if (!res.ok) { errEl.textContent = data.error || 'Submission failed'; errEl.classList.add('on'); btn.disabled = false; btn.textContent = 'Submit Application'; return; }

    closeApply();
    applicationStatus = 'pending';
    renderDesignerCard('member', { status: 'pending', message: msg });
  } catch {
    errEl.textContent = 'Connection error.'; errEl.classList.add('on');
    btn.disabled = false; btn.textContent = 'Submit Application';
  }
}

init();
</script>
